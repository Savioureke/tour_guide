name: CI - build React app

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd react
          npm ci
      - name: Build
        run: |
          cd react
          npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: react/dist
